Name: transhome-api
Host: 0.0.0.0
Port: 8888

# Diisi dari environment variable (lihat .env.example).
# Muat dengan conf.MustLoad(file, &c, conf.UseEnv()).
Database:
  DataSource: ${DATABASE_URL}

Auth:
  AccessSecret: ${JWT_SECRET}
  AccessExpire: 86400 # Token berlaku 24 jam

# Hanya operator server yang dapat mengganti nomor; restart backend setelah perubahan.
WhatsApp:
  Number: "${WHATSAPP_NUMBER}"

Qontak:
  BaseURL: ${QONTAK_BASE_URL}
  Token: ${QONTAK_API_TOKEN}
